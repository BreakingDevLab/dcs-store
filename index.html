<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storefront | DCS Store</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #38bdf8; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .menu-item { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
    .menu-item h3 { margin: 0 0 8px 0; }
    .price { color: #22c55e; font-weight: bold; margin-bottom: 12px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0ea5e9; }
    .cart-box { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
    input { width: 100%; padding: 8px; margin: 8px 0 16px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍔 DCS Storefront</h1>
    <p>Select items and place your order securely.</p>

    <div class="menu-grid" id="menu-container"></div>

    <div class="cart-box">
      <h2>Your Cart</h2>
      <div id="cart-items">Cart is empty</div>
      <p><strong>Total: <span id="cart-total">R0.00</span></strong></p>
      
      <label for="customer-name">Your Name:</label>
      <input type="text" id="customer-name" placeholder="Enter your name">

      <button onclick="checkoutOrder()" id="checkout-btn" disabled>Place Order</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const menu = [
      { id: 1, name: 'Double Cheeseburger', price: 85 },
      { id: 2, name: 'Loaded Fries', price: 45 },
      { id: 3, name: 'Craft Soda', price: 25 },
      { id: 4, name: 'Crispy Chicken Wings', price: 65 }
    ];

    let cart = [];

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = menu.map(item => `
        <div class="menu-item">
          <h3>${item.name}</h3>
          <div class="price">R${item.price.toFixed(2)}</div>
          <button onclick="addToCart(${item.id})">Add to Cart</button>
        </div>
      `).join('');
    }

    function addToCart(itemId) {
      const item = menu.find(m => m.id === itemId);
      cart.push(item);
      updateCartUI();
    }

    function updateCartUI() {
      const itemsContainer = document.getElementById('cart-items');
      const totalContainer = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('checkout-btn');

      if (cart.length === 0) {
        itemsContainer.innerHTML = 'Cart is empty';
        totalContainer.innerText = 'R0.00';
        checkoutBtn.disabled = true;
        return;
      }

      let total = 0;
      itemsContainer.innerHTML = cart.map(item => {
        total += item.price;
        return `<div>${item.name} - R${item.price.toFixed(2)}</div>`;
      }).join('');

      totalContainer.innerText = 'R' + total.toFixed(2);
      checkoutBtn.disabled = false;
    }

    // Robust server-confirmed checkout with upsert
    async function postOrderToSupabase(order) {
      try {
        const { error } = await supabaseClient
          .from('orders')
          .upsert({
            id: order.id,
            customer_name: order.clientName,
            phone: order.phone || '',
            address: order.address || '',
            items: JSON.stringify(order.items),
            notes: order.instructions || '',
            total: Number(order.total || 0),
            stage: order.stage || 'received',
            status: order.stage || 'received',
            created_at: new Date(order.timestamp).toISOString()
          })
          .select();

        if (error) {
          console.error(error);
          return false;
        }
        return true;
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    async function checkoutOrder() {
      const nameInput = document.getElementById('customer-name').value.trim();
      if (!nameInput) {
        alert('Please enter your name before placing an order.');
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const timestampNow = Date.now();
      
      const newOrder = {
        id: 'DCS-' + timestampNow,
        clientName: nameInput,
        items: cart,
        total: total,
        stage: 'received',
        timestamp: timestampNow
      };

      const checkoutBtn = document.getElementById('checkout-btn');
      checkoutBtn.innerText = 'Verifying & Sending...';
      checkoutBtn.disabled = true;

      const success = await postOrderToSupabase(newOrder);

      if (!success) {
        alert('Order could not reach the server. Please check your connection.');
        checkoutBtn.innerText = 'Place Order';
        checkoutBtn.disabled = false;
        return;
      }

      alert('Order successfully placed! Order ID: ' + newOrder.id);
      cart = [];
      document.getElementById('customer-name').value = '';
      updateCartUI();
      checkoutBtn.innerText = 'Place Order';
    }

    renderMenu();
  </script>
</body>
</html>
