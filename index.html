<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Davidsonville Community Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-16">

  <!-- Navigation Header -->
  <header class="bg-gray-900 text-white p-4 shadow-lg sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Davidsonville Store</h1>
        <p class="text-xs text-gray-400">Community Storefront</p>
      </div>
      <a href="staff.html" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-lg border border-gray-700 transition">Staff Area</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- ACTIVE ORDER SLIPS CONTAINER -->
    <section id="activeOrdersSection" class="space-y-3">
      <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        <span>📋</span> Your Active Order Slips
      </h2>
      <div id="activeOrderSlipsContainer" class="space-y-3">
        <!-- Order slips rendered dynamically -->
        <p class="text-xs text-gray-400 bg-white p-4 rounded-xl border border-gray-200 text-center">No active order slips found on this device.</p>
      </div>
    </section>

    <!-- STOREFRONT ORDER FORM -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="text-2xl font-bold text-gray-800">Place an Order</h2>
      <p class="text-xs text-gray-500">Fill in your details and select items to submit an order directly to store staff.</p>

      <form id="orderForm" onsubmit="handleNewOrderSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Your Full Name</label>
            <input type="text" id="custName" required placeholder="e.g. John Doe" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Phone Number</label>
            <input type="tel" id="custPhone" required placeholder="e.g. 0821234567" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Items Description / Order Notes</label>
          <textarea id="custItems" rows="3" required placeholder="e.g. 2x Milk 2L, 1x Bread, 1x Eggs 12pk" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Estimated Total (ZAR)</label>
            <input type="number" step="0.01" id="custTotal" required placeholder="e.g. 150.00" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Fulfillment Preference</label>
            <select id="custFulfillment" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="pickup">Store Pickup</option>
              <option value="delivery">Local Delivery</option>
            </select>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md text-sm"
        >
          Submit Order to Store
        </button>
      </form>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://qbmszgddepljxqxynyxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibXN6Z2RkZXBsanhxeHlueXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODUzMzcsImV4cCI6MjEwNjE2MTMzN30.Xn96bQzIKht44_6IYTkXMY6wk3sT2uf2IJtbOhW1WgU';

    let supabaseClient = null;

    function getSupabaseClient() {
      if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return supabaseClient;
    }

    // --- SUBMIT NEW ORDER ---
    async function handleNewOrderSubmit(e) {
      e.preventDefault();
      const client = getSupabaseClient();
      if (!client) {
        alert("Database connection error. Please try again.");
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const itemsText = document.getElementById('custItems').value.trim();
      const total = parseFloat(document.getElementById('custTotal').value) || 0.00;
      const fulfillment = document.getElementById('custFulfillment').value;

      const newOrderId = Math.floor(100000 + Math.random() * 900000).toString();

      const orderPayload = {
        order_id: newOrderId,
        customer_name: name,
        phone: phone,
        items: JSON.stringify([{ name: itemsText, qty: 1, price: total }]),
        total: total,
        stage: 'received',
        status: 'received',
        fulfillment: fulfillment,
        is_reorder: false,
        created_at: new Date().toISOString()
      };

      const { error } = await client.from('orders').insert([orderPayload]);

      if (error) {
        alert("Failed to submit order: " + error.message);
        return;
      }

      saveOrderSlipLocally(orderPayload);
      renderActiveOrderSlips();

      alert(`Order #${newOrderId} submitted successfully! Your order slip is visible below.`);
      document.getElementById('orderForm').reset();
    }

    // --- RESUBMIT ORDER FROM SLIP ---
    async function resubmitOrderFromSlip(orderIdRef) {
      const slips = getLocalSlips();
      const order = slips.find(o => String(o.order_id) === String(orderIdRef) || String(o.id) === String(orderIdRef));

      if (!order) {
        alert("Order slip details not found.");
        return;
      }

      if (!confirm(`Do you want to resubmit Order #${orderIdRef} to store staff as a REORDER?`)) {
        return;
      }

      const client = getSupabaseClient();
      if (!client) return;

      const newOrderId = Math.floor(100000 + Math.random() * 900000).toString();

      const reorderPayload = {
        order_id: newOrderId,
        customer_name: order.customer_name || 'Guest',
        phone: order.phone || '-',
        items: order.items || '[]',
        total: order.total || 0.00,
        stage: 'received',
        status: 'received',
        fulfillment: order.fulfillment || 'pickup',
        is_reorder: true,
        created_at: new Date().toISOString()
      };

      const { error } = await client.from('orders').insert([reorderPayload]);

      if (error) {
        alert("Failed to resubmit order: " + error.message);
        return;
      }

      saveOrderSlipLocally(reorderPayload);
      renderActiveOrderSlips();

      alert(`Order #${newOrderId} has been successfully resubmitted to staff as a REORDER!`);
    }

    // --- LOCAL SLIP STORAGE HELPERS ---
    function getLocalSlips() {
      try {
        return JSON.parse(localStorage.getItem('dcs_my_order_slips') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveOrderSlipLocally(orderPayload) {
      const existing = getLocalSlips();
      existing.unshift(orderPayload);
      localStorage.setItem('dcs_my_order_slips', JSON.stringify(existing.slice(0, 10)));
    }

    // --- RENDER ACTIVE ORDER SLIPS WITH REORDER BUTTON ---
    function renderActiveOrderSlips() {
      const container = document.getElementById('activeOrderSlipsContainer');
      if (!container) return;

      const slips = getLocalSlips();

      if (slips.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 bg-white p-4 rounded-xl border border-gray-200 text-center">No active order slips found on this device.</p>`;
        return;
      }

      container.innerHTML = slips.map(order => {
        const orderId = order.order_id || order.id || 'N/A';
        const name = order.customer_name || 'Guest';
        const phone = order.phone || '-';
        const total = order.total ? `R${Number(order.total).toFixed(2)}` : 'R0.00';
        const time = order.created_at ? new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'N/A';
        const isReorder = order.is_reorder;

        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <div class="flex justify-between items-start border-b pb-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-mono font-bold text-sm text-blue-600">Order #${orderId}</span>
                  ${isReorder ? '<span class="text-[10px] bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded">🔄 REORDER</span>' : ''}
                </div>
                <p class="text-xs text-gray-500 font-medium">${name} • 📞 ${phone}</p>
              </div>
              <span class="text-xs bg-gray-100 text-gray-600 font-medium px-2 py-1 rounded">${time}</span>
            </div>

            <div class="flex justify-between items-center text-xs">
              <span class="text-gray-500">Estimated Total: <strong class="text-gray-900">${total}</strong></span>
              <span class="text-gray-500">Fulfillment: <strong class="text-gray-900 capitalize">${order.fulfillment || 'pickup'}</strong></span>
            </div>

            <!-- ACTION BUTTON INSIDE ORDER SLIP -->
            <div class="pt-2 border-t border-gray-100 flex justify-end">
              <button 
                onclick="resubmitOrderFromSlip('${orderId}')" 
                class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold transition flex items-center gap-1.5 shadow-sm"
              >
                <span>🔄</span> Resubmit / Reorder
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', renderActiveOrderSlips);
  </script>
</body>
</html>
