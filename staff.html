<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Davidsonville Staff Dashboard — Kanban & Kitchen Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍗</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --primary:#0f172a; --brand:#d97706; --bg:#f8fafc; --card:#ffffff; --muted:#475569;
      --border:#e2e8f0; --radius:12px; --shadow:0 12px 30px rgba(15,23,42,0.08);
      --kanban-gap:12px;
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{margin:0;background:var(--bg);color:var(--primary);min-height:100vh;padding:18px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:10px;background:linear-gradient(90deg,#0f172a,#1e293b);color:#fff;box-shadow:var(--shadow)}
    header .brand{display:flex;align-items:center;gap:12px}
    .brand-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
    .brand-title h1{font-size:1.05rem;margin:0;font-weight:800}
    .brand-title p{margin:0;font-size:.78rem;opacity:.9;color:rgba(255,255,255,0.9)}
    .controls{display:flex;gap:10px;align-items:center}
    .btn{background:var(--brand);color:#fff;border:none;padding:.55rem .8rem;border-radius:8px;font-weight:700;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.15);color:#fff}
    .btn.small{padding:.35rem .6rem;font-size:.8rem}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:18px}
    .panel{background:linear-gradient(180deg,#ffffff,#fbfdff);border-radius:12px;padding:12px;border:1px solid var(--border);box-shadow:var(--shadow);color:var(--primary)}
    .panel h3{margin:0 0 8px 0;font-size:0.95rem}
    .staff-log-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;padding-top:6px}
    .log-row{padding:8px;border-radius:8px;border:1px dashed var(--border);background:#fff;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;color:var(--primary)}
    .log-meta{font-size:.82rem;color:var(--muted)}
    .kanban-wrap{display:flex;gap:var(--kanban-gap);align-items:flex-start;height:calc(100vh - 170px);overflow-x:auto}
    .column{flex:1;min-width:210px;background:linear-gradient(180deg,#fff,#fbfdff);border-radius:12px;padding:12px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%}
    .col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .col-title{font-weight:900;color:var(--primary)}
    .col-count{font-size:.85rem;color:var(--muted);font-weight:700}
    .dropzone{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:10px;min-height:150px;border:2px dashed transparent;border-radius:8px;transition:border-color 0.2s}
    .dropzone.drag-over{border-color:var(--brand);background:rgba(217,119,6,0.04)}
    .card{background:#fff;border-radius:10px;padding:10px;border:1px solid var(--border);box-shadow:0 6px 18px rgba(15,23,42,0.04);cursor:grab;color:var(--primary)}
    .card.dragging{opacity:.5}
    .card .meta{font-size:.82rem;color:var(--muted);margin-top:4px}
    .card .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
    .badge{background:#eef2ff;padding:4px 8px;border-radius:999px;font-weight:800;color:var(--primary);font-size:.78rem}
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
    .modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:300;padding:1rem}
    .modal-content{background:#fff;border-radius:12px;max-width:480px;width:100%;padding:1.25rem;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
    footer{margin-top:14px;text-align:center;color:var(--muted);font-size:.85rem}
    @media(max-width:980px){ .layout{grid-template-columns:1fr;} .kanban-wrap{flex-direction:column;height:auto} }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🍗</div>
      <div class="brand-title">
        <h1>Davidsonville Staff Dashboard</h1>
        <p>Live Kitchen Orders & Supabase Sync</p>
      </div>
    </div>

    <div class="controls">
      <div style="font-size:0.85rem">Status: <span id="staff-status" style="font-weight:800;color:#10b981">Connecting...</span></div>
      <button class="btn" id="refresh-btn">Refresh</button>
      <button class="btn small" id="clear-completed">Clear Completed</button>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="panel">
        <h3>Staff Log</h3>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <input id="staff-name" placeholder="Staff Name" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border)">
          <input id="staff-action" placeholder="Action" style="flex:2;padding:8px;border-radius:8px;border:1px solid var(--border)">
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="btn small" id="add-log">Add Log</button>
          <button class="btn small" id="clear-logs" style="background:#b91c1c">Clear Logs</button>
        </div>
        <div class="staff-log-list" id="staff-log-list"></div>
      </div>

      <div class="panel" style="margin-top:12px">
        <h3>Incoming Order Audio Alert</h3>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn small" id="toggle-chime">Chime: On</button>
          <button class="btn small" id="accept-all" style="background:#16a34a">Accept All Pending</button>
        </div>
      </div>

      <div class="panel" style="margin-top:12px">
        <h3>Filters</h3>
        <div style="display:flex;gap:8px;margin-top:8px">
          <select id="filter-stage" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border)">
            <option value="">All Stages</option>
            <option value="pending">Pending</option>
            <option value="received">Received</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready</option>
            <option value="completed">Completed</option>
          </select>
          <input id="filter-phone" placeholder="Phone Search" style="padding:8px;border-radius:8px;border:1px solid var(--border)">
        </div>
      </div>
    </aside>

    <main>
      <div class="kanban-wrap">
        <div class="column" data-stage="pending">
          <div class="col-header">
            <div class="col-title">New Orders</div>
            <div class="col-count" id="count-pending">0</div>
          </div>
          <div class="dropzone" id="col-pending"></div>
        </div>

        <div class="column" data-stage="received">
          <div class="col-header">
            <div class="col-title">Accepted</div>
            <div class="col-count" id="count-received">0</div>
          </div>
          <div class="dropzone" id="col-received"></div>
        </div>

        <div class="column" data-stage="preparing">
          <div class="col-header">
            <div class="col-title">Kitchen Prep</div>
            <div class="col-count" id="count-preparing">0</div>
          </div>
          <div class="dropzone" id="col-preparing"></div>
        </div>

        <div class="column" data-stage="ready">
          <div class="col-header">
            <div class="col-title">Ready Pickup</div>
            <div class="col-count" id="count-ready">0</div>
          </div>
          <div class="dropzone" id="col-ready"></div>
        </div>

        <div class="column" data-stage="completed">
          <div class="col-header">
            <div class="col-title">Completed</div>
            <div class="col-count" id="count-completed">0</div>
          </div>
          <div class="dropzone" id="col-completed"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Slip Modal -->
  <div id="slip-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="slip-body"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button onclick="window.print()" class="btn" style="flex:1;">🖨️ Print Kitchen Slip</button>
        <button onclick="closeSlipModal()" class="btn ghost" style="flex:1; background:#64748b; color:#fff;">Close</button>
      </div>
    </div>
  </div>

  <footer>Synced via Supabase REST & Local Storage Key: <code style="background:#fff;padding:2px 6px;border-radius:4px;border:1px solid var(--border)">davidsonville_app_state_v15</code></footer>

  <script>
    const SUPABASE_URL = 'https://qbmszgddepljxqxynyxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibXN6Z2RkZXBsanhxeHlueXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODUzMzcsImV4cCI6MjEwNjE2MTMzN30.Xn96bQzIKht44_6IYTkXMY6wk3sT2uf2IJtbOhW1WgU';

    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const SHARED_KEY = 'davidsonville_app_state_v15';
    let chimeEnabled = true;
    let audioCtx = null;
    let lastPendingCount = 0;

    function getSharedState() {
      try {
        const raw = localStorage.getItem(SHARED_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { console.error('Read shared state error:', e); }
      return { clients: [], orders: [], staffLogs: [] };
    }

    function saveSharedState(state) {
      try {
        localStorage.setItem(SHARED_KEY, JSON.stringify(state));
        window.dispatchEvent(new CustomEvent('dcsStateUpdated', { detail: state }));
      } catch (e) { console.error('Save shared state error:', e); }
    }

    function parseItems(items) {
      if (!items) return [];
      if (Array.isArray(items)) return items;
      if (typeof items === 'string') {
        try { return JSON.parse(items); } catch(e) { return []; }
      }
      return [];
    }

    async function syncFromSupabase() {
      if (!supabaseClient) return;
      try {
        const { data: dbOrders, error: errOrders } = await supabaseClient.from('orders').select('*');
        const { data: dbLogs } = await supabaseClient.from('staff_logs').select('*');

        if (!errOrders && dbOrders) {
          const s = getSharedState();
          
          // Check if new pending order arrived
          const currentPending = dbOrders.filter(o => String(o.stage || '').toLowerCase() === 'pending').length;
          if (currentPending > lastPendingCount) playChime();
          lastPendingCount = currentPending;

          s.orders = dbOrders.map(o => ({
            id: String(o.id || ''),
            clientName: o.client_name || o.clientName || 'Guest',
            phone: o.phone || '',
            paymentMethod: o.payment_method || o.paymentMethod || 'Cash',
            items: parseItems(o.items),
            subtotal: Number(o.subtotal || 0),
            total: Number(o.total || 0),
            stage: String(o.stage || 'pending').toLowerCase().trim(),
            date: o.date || new Date().toLocaleDateString(),
            timestamp: o.timestamp ? new Date(o.timestamp).getTime() : Date.now(),
            instructions: o.instructions || ''
          }));

          if (dbLogs) {
            s.staffLogs = dbLogs.map(l => ({
              staff: l.staff || 'Staff',
              action: l.action || '',
              timestamp: l.timestamp ? new Date(l.timestamp).getTime() : Date.now()
            }));
          }

          saveSharedState(s);
          renderBoard();
          renderStaffLogs();

          const statusEl = document.getElementById('staff-status');
          statusEl.innerText = `Online (${dbOrders.length} orders)`;
          statusEl.style.color = '#10b981';
        }
      } catch (err) {
        document.getElementById('staff-status').innerText = 'Offline (Local)';
        document.getElementById('staff-status').style.color = '#f59e0b';
      }
    }

    function subscribeSupabaseRealtime() {
      if (!supabaseClient) return;
      supabaseClient.channel('staff_orders_channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => syncFromSupabase())
        .subscribe();
    }

    async function pushOrderStageToSupabase(orderId, stage) {
      if (!supabaseClient) return;
      try { await supabaseClient.from('orders').update({ stage: stage }).eq('id', orderId); }
      catch (e) { console.error('Failed pushing stage:', e); }
    }

    async function pushStaffLogToSupabase(staff, action, timestamp) {
      if (!supabaseClient) return;
      try { await supabaseClient.from('staff_logs').insert([{ staff, action, timestamp: new Date(timestamp).toISOString() }]); }
      catch (e) { console.error('Failed pushing log:', e); }
    }

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('click', unlockAudio, { once: true });

    function playChime() {
      if (!chimeEnabled) return;
      try {
        unlockAudio();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        o.connect(g); g.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.15, now + 0.01);
        o.start(now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3); o.stop(now + 0.31);
      } catch (e) { console.warn('Chime audio blocked:', e); }
    }

    function setStage(orderId, newStage) {
      const s = getSharedState();
      const idx = (s.orders || []).findIndex(o => o.id === orderId);
      if (idx !== -1) {
        s.orders[idx].stage = newStage;
        const staff = (document.getElementById('staff-name').value.trim()) || 'Staff';
        const action = `Moved order #${orderId} to ${newStage.toUpperCase()}`;
        const ts = Date.now();
        s.staffLogs = s.staffLogs || [];
        s.staffLogs.push({ staff, action, timestamp: ts });
        saveSharedState(s);
        pushOrderStageToSupabase(orderId, newStage);
        pushStaffLogToSupabase(staff, action, ts);
        renderBoard(); renderStaffLogs();
      }
    }

    function changeStage(orderId, delta) {
      const stages = ['pending', 'received', 'preparing', 'ready', 'completed'];
      const s = getSharedState();
      const order = (s.orders || []).find(o => o.id === orderId);
      if (order) {
        let currentIdx = stages.indexOf(order.stage);
        if (currentIdx === -1) currentIdx = 0;
        let newIdx = Math.max(0, Math.min(stages.length - 1, currentIdx + delta));
        setStage(orderId, stages[newIdx]);
      }
    }

    function renderBoard() {
      const state = getSharedState();
      const orders = (state.orders || []).slice().sort((a,b) => b.timestamp - a.timestamp);
      const filterStage = document.getElementById('filter-stage').value;
      const filterPhone = document.getElementById('filter-phone').value.trim();
      const stages = ['pending', 'received', 'preparing', 'ready', 'completed'];

      stages.forEach(s => {
        const col = document.getElementById('col-' + s);
        if (col) col.innerHTML = '';
      });

      orders.filter(o => {
        if (filterStage && o.stage !== filterStage) return false;
        if (filterPhone && (!o.phone || !o.phone.includes(filterPhone))) return false;
        return true;
      }).forEach(order => {
        const stageKey = order.stage || 'pending';
        const card = document.createElement('div');
        card.className = 'card'; card.draggable = true; card.id = 'order-' + order.id;

        const itemsCount = Array.isArray(order.items) ? order.items.reduce((acc, i) => acc + (i.qty || 1), 0) : 0;

        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong style="font-size:0.95rem">#${order.id}</strong>
            <span class="badge">${order.date || ''}</span>
          </div>
          <div style="margin-top:4px;font-weight:800">${order.clientName || 'Guest'}</div>
          <div class="meta">📞 ${order.phone || 'N/A'} • ${order.paymentMethod || 'Cash'}</div>
          <div class="meta">📦 Items: ${itemsCount} • Total: R${Number(order.total || 0).toFixed(2)}</div>
          ${order.instructions ? `<div class="meta" style="color:#d97706">📝 ${order.instructions}</div>` : ''}
          <div class="actions" style="margin-top:8px">
            ${stageKey === 'pending' ? `<button class="btn small" onclick="setStage('${order.id}', 'received')">Accept</button>` : ''}
            <button class="btn small ghost" style="background:#475569" onclick="changeStage('${order.id}', -1)">←</button>
            <button class="btn small ghost" style="background:#475569" onclick="changeStage('${order.id}', 1)">→</button>
            <button class="btn small" style="background:#0ea5e9" onclick="showSlipFromId('${order.id}')">Slip</button>
            <button class="btn small" style="background:#16a34a" onclick="setStage('${order.id}', 'completed')">✓</button>
          </div>`;

        card.addEventListener('dragstart', ev => ev.dataTransfer.setData('text/plain', order.id));

        const colEl = document.getElementById('col-' + stageKey) || document.getElementById('col-pending');
        if (colEl) colEl.appendChild(card);
      });

      stages.forEach(s => {
        const count = orders.filter(o => o.stage === s).length;
        document.getElementById('count-' + s).innerText = count;
      });
    }

    function initDragAndDrop() {
      const dropzones = document.querySelectorAll('.dropzone');
      dropzones.forEach(dz => {
        dz.addEventListener('dragover', e => {
          e.preventDefault(); dz.classList.add('drag-over');
        });
        dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
        dz.addEventListener('drop', e => {
          e.preventDefault(); dz.classList.remove('drag-over');
          const orderId = e.dataTransfer.getData('text/plain');
          const targetStage = dz.parentElement.getAttribute('data-stage');
          if (orderId && targetStage) setStage(orderId, targetStage);
        });
      });
    }

    function renderStaffLogs() {
      const s = getSharedState();
      const list = document.getElementById('staff-log-list');
      const logs = (s.staffLogs || []).slice().reverse();
      if (logs.length === 0) { list.innerHTML = '<div style="font-size:0.8rem;color:var(--muted)">No staff logs.</div>'; return; }
      list.innerHTML = logs.map(l => `
        <div class="log-row">
          <div><strong>${l.staff}</strong><br><span class="log-meta">${l.action}</span></div>
          <div class="log-meta">${new Date(l.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
        </div>`).join('');
    }

    function showSlipFromId(orderId) {
      const s = getSharedState();
      const order = (s.orders || []).find(o => o.id === orderId);
      if (!order) return;
      document.getElementById('slip-body').innerHTML = `
        <div style="font-family:'Courier New',monospace; border:1px dashed #cbd5e1; padding:12px; border-radius:8px;">
          <strong style="font-size:1.1rem">Davidsonville Kitchen Slip</strong><br>
          Order ID: #${order.id}<br>
          Client: ${order.clientName} (${order.phone})<br>
          Payment: ${order.paymentMethod}<br>
          <hr style="border:0.5px dashed #000; margin:8px 0;">
          ${(order.items || []).map(i => `<div>${i.qty}x ${i.name} - R${(i.price * i.qty).toFixed(2)}</div>`).join('')}
          <hr style="border:0.5px dashed #000; margin:8px 0;">
          <strong>Total: R${Number(order.total || 0).toFixed(2)}</strong><br>
          ${order.instructions ? `Instructions: ${order.instructions}` : ''}
        </div>`;
      document.getElementById('slip-modal').style.display = 'flex';
    }

    function closeSlipModal() { document.getElementById('slip-modal').style.display = 'none'; }

    document.getElementById('refresh-btn').addEventListener('click', () => syncFromSupabase());
    document.getElementById('clear-completed').addEventListener('click', async () => {
      if (!confirm('Clear completed orders?')) return;
      let s = getSharedState();
      s.orders = (s.orders || []).filter(o => o.stage !== 'completed');
      saveSharedState(s); renderBoard();
      if (supabaseClient) await supabaseClient.from('orders').delete().eq('stage', 'completed');
    });

    document.getElementById('add-log').addEventListener('click', () => {
      const name = document.getElementById('staff-name').value.trim();
      const action = document.getElementById('staff-action').value.trim();
      if (!name || !action) return alert('Enter name and action.');
      const ts = Date.now();
      let s = getSharedState();
      s.staffLogs = s.staffLogs || [];
      s.staffLogs.push({ staff: name, action, timestamp: ts });
      saveSharedState(s); renderStaffLogs(); pushStaffLogToSupabase(name, action, ts);
      document.getElementById('staff-action').value = '';
    });

    document.getElementById('clear-logs').addEventListener('click', async () => {
      let s = getSharedState(); s.staffLogs = []; saveSharedState(s); renderStaffLogs();
      if (supabaseClient) await supabaseClient.from('staff_logs').delete().neq('staff', '');
    });

    document.getElementById('toggle-chime').addEventListener('click', e => {
      chimeEnabled = !chimeEnabled;
      e.target.innerText = `Chime: ${chimeEnabled ? 'On' : 'Off'}`;
    });

    document.getElementById('accept-all').addEventListener('click', () => {
      let s = getSharedState();
      (s.orders || []).forEach(o => {
        if (o.stage === 'pending') {
          o.stage = 'received';
          pushOrderStageToSupabase(o.id, 'received');
        }
      });
      saveSharedState(s); renderBoard();
    });

    document.getElementById('filter-stage').addEventListener('change', () => renderBoard());
    document.getElementById('filter-phone').addEventListener('input', () => renderBoard());

    window.addEventListener('DOMContentLoaded', () => {
      initDragAndDrop();
      syncFromSupabase();
      subscribeSupabaseRealtime();
      setInterval(syncFromSupabase, 4000);
    });
  </script>
</body>
</html>
