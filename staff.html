<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍🍳</text></svg>">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Davidsonville Community Store | Staff Kitchen Dashboard</title>
  <style>
    :root{
      --primary:#0f172a; --brand:#d97706; --brand-gradient:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);
      --bg-page:#f8fafc; --card-bg:#ffffff; --muted:#64748b; --border:#e2e8f0;
      --shadow:0 10px 25px -5px rgba(0,0,0,0.08);
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,sans-serif}
    body{background:var(--bg-page); color:var(--primary); min-height:100vh; padding-bottom:40px;}
    header{
      background:var(--primary); color:#fff; padding:1rem 1.5rem; display:flex; align-items:center;
      justify-content:space-between; box-shadow:0 4px 20px rgba(0,0,0,0.12);
    }
    .header-title h1{font-size:1.2rem; font-weight:800}
    .header-title p{font-size:.78rem; color:#cbd5e1}
    .kanban-board{
      display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:1rem;
      padding:1.5rem; max-width:1400px; margin:0 auto;
    }
    .kanban-column{
      background:#f1f5f9; border-radius:12px; border:1px solid var(--border); padding:1rem; min-height:500px;
      display:flex; flex-direction:column;
    }
    .column-header{
      font-weight:800; font-size:.9rem; text-transform:uppercase; margin-bottom:1rem; display:flex;
      justify-content:space-between; align-items:center; padding-bottom:.5rem; border-bottom:2px solid var(--border);
    }
    .column-badge{background:var(--primary); color:#fff; padding:.15rem .5rem; border-radius:20px; font-size:.75rem}
    .order-card{
      background:#fff; border-radius:10px; border:1px solid var(--border); padding:.9rem; margin-bottom:.85rem;
      box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:space-between; gap:.5rem;
    }
    .order-card-header{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f1f5f9; padding-bottom:.4rem}
    .order-id{font-weight:800; font-size:.9rem; color:var(--primary)}
    .order-time{font-size:.72rem; color:var(--muted)}
    .order-customer{font-size:.82rem; font-weight:700; color:#334155}
    .order-items{font-size:.82rem; background:#f8fafc; padding:.5rem; border-radius:6px; margin:.2rem 0; list-style:none}
    .order-items li{display:flex; justify-content:space-between; margin-bottom:.2rem}
    .order-notes{font-size:.75rem; background:#fffbeb; color:#b45309; padding:.4rem; border-radius:6px; border-left:3px solid var(--brand)}
    .stage-btn-group{display:flex; gap:.4rem; margin-top:.5rem; flex-wrap:wrap}
    .stage-btn{
      flex:1; padding:.4rem; border:none; border-radius:6px; font-weight:700; font-size:.72rem;
      cursor:pointer; color:#fff; text-align:center;
    }
    .btn-received{background:#64748b}
    .btn-pending{background:#d97706}
    .btn-prep{background:#2563eb}
    .btn-ready{background:#059669}
    .btn-completed{background:#16a34a}
    .btn-cancel{background:#dc2626}
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>👨‍🍳 Staff Kitchen Workflow Dashboard</h1>
      <p>Davidsonville Community Store | Live Kitchen Order Kanban</p>
    </div>
    <div>
      <button onclick="fetchStaffOrders()" style="padding:.5rem 1rem; border-radius:8px; border:none; background:var(--brand); color:#fff; font-weight:700; cursor:pointer;">🔄 Refresh Orders</button>
    </div>
  </header>

  <div class="kanban-board">
    <div class="kanban-column">
      <div class="column-header">
        <span>📥 Received</span>
        <span id="badge-received" class="column-badge">0</span>
      </div>
      <div id="col-received" class="column-orders"></div>
    </div>

    <div class="kanban-column">
      <div class="column-header">
        <span>⏳ Pending</span>
        <span id="badge-pending" class="column-badge">0</span>
      </div>
      <div id="col-pending" class="column-orders"></div>
    </div>

    <div class="kanban-column">
      <div class="column-header">
        <span>🍳 Kitchen Prep</span>
        <span id="badge-kitchen-prep" class="column-badge">0</span>
      </div>
      <div id="col-kitchen-prep" class="column-orders"></div>
    </div>

    <div class="kanban-column">
      <div class="column-header">
        <span>✅ Ready for Pickup</span>
        <span id="badge-ready" class="column-badge">0</span>
      </div>
      <div id="col-ready" class="column-orders"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qbmszgddepljxqxynyxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibXN6Z2RkZXBsanhxeHlueXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODUzMzcsImV4cCI6MjEwNjE2MTMzN30.Xn96bQzIKht44_6IYTkXMY6wk3sT2uf2IJtbOhW1WgU';

    let staffOrders = [];

    async function fetchStaffOrders() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        if (res.ok) {
          const data = await res.json();
          staffOrders = data;
          renderKanbanBoard();
        }
      } catch(e) {}
    }

    async function updateOrderStatus(orderId, newStage) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/orders?order_id=eq.${encodeURIComponent(orderId)}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ stage: newStage })
        });
        fetchStaffOrders();
      } catch(e) {}
    }

    function parseOrderItems(rawItems) {
      if (!rawItems) return [];
      if (Array.isArray(rawItems)) return rawItems;
      try { const p = JSON.parse(rawItems); if (Array.isArray(p)) return p; return [p]; } catch (e) { return [{ name: rawItems, qty: 1, price: 0 }]; }
    }

    function renderKanbanBoard() {
      const stages = ['received', 'pending', 'kitchen-prep', 'ready'];
      
      stages.forEach(st => {
        const col = document.getElementById(`col-${st}`);
        const badge = document.getElementById(`badge-${st}`);
        
        const filtered = staffOrders.filter(o => {
          const stage = (o.stage || o.status || 'received').toLowerCase().trim().replace(/_/g, '-');
          if (st === 'ready') return stage === 'ready' || stage === 'ready-for-pick-up';
          return stage === st;
        });

        badge.innerText = filtered.length;

        if (filtered.length === 0) {
          col.innerHTML = '<p style="font-size:0.8rem; color:var(--muted); text-align:center; padding:1rem 0;">No orders</p>';
          return;
        }

        col.innerHTML = filtered.map(o => {
          const oid = o.order_id || o.id;
          const items = parseOrderItems(o.items);
          const time = o.created_at ? new Date(o.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

          return `
            <div class="order-card">
              <div class="order-card-header">
                <span class="order-id">#${oid}</span>
                <span class="order-time">${time}</span>
              </div>
              <div class="order-customer">👤 ${o.client_name || 'Customer'} (${o.phone || 'N/A'})</div>
              <ul class="order-items">
                ${items.map(i => `<li><span>${i.qty || 1}x ${i.name \vert{}\vert{} i.title}</span> <strong>R${((i.qty||1)*Number(i.price||0)).toFixed(2)}</strong></li>`).join('')}
              </ul>
              ${o.instructions ? `<div class="order-notes"><strong>Notes:</strong> ${o.instructions}</div>` : ''}
              <div style="font-weight:bold; font-size:0.85rem; color:var(--brand); display:flex; justify-content:space-between; align-items:center;">
                <span>Total:</span> <span>R${Number(o.total || 0).toFixed(2)}</span>
              </div>
              <div class="stage-btn-group">
                ${st !== 'pending' ? `<button onclick="updateOrderStatus('${oid}', 'pending')" class="stage-btn btn-pending">Pending</button>` : ''}
                ${st !== 'kitchen-prep' ? `<button onclick="updateOrderStatus('${oid}', 'kitchen-prep')" class="stage-btn btn-prep">Prep</button>` : ''}
                ${st !== 'ready' ? `<button onclick="updateOrderStatus('${oid}', 'ready')" class="stage-btn btn-ready">Ready</button>` : ''}
                <button onclick="updateOrderStatus('${oid}', 'order-completed')" class="stage-btn btn-completed">Complete</button>
                <button onclick="updateOrderStatus('${oid}', 'cancelled')" class="stage-btn btn-cancel">Cancel</button>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchStaffOrders();
      setInterval(fetchStaffOrders, 4000);
    });
  </script>
</body>
</html>
