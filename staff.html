<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS Dashboard | DCS Store</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; color: #38bdf8; }
    #live-status-indicator { font-weight: bold; padding: 6px 12px; border-radius: 20px; background: #ef4444; color: white; border: 1px solid #334155; }
    
    .revenue-card { background: #1e293b; color: white; padding: 16px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #334155; }
    .revenue-amount { font-size: 28px; font-weight: bold; color: #22c55e; margin-top: 4px; }

    .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 1024px) { .kanban { grid-template-columns: 1fr; } }
    .column { background: #1e293b; border-radius: 8px; padding: 16px; min-height: 400px; border: 1px solid #334155; }
    .column h2 { font-size: 16px; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-top: 0; }
    .order-card { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #334155; }
    .order-card h4 { margin: 0 0 6px 0; color: #38bdf8; }
    .btn-action { margin-top: 8px; background: #22c55e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>👨‍🍳 Kitchen Display System (KDS)</h1>
    <div id="live-status-indicator">🔴 Disconnected</div>
  </div>

  <div class="revenue-card">
    <div>
      <h3 style="margin: 0; font-size: 13px; color: #94a3b8; text-transform: uppercase;">Today's Revenue</h3>
      <div id="daily-revenue-amount" class="revenue-amount">R0</div>
    </div>
    <div style="font-size: 32px;">💰</div>
  </div>

  <div class="kanban">
    <div class="column"><h2>Received</h2><div id="col-received"></div></div>
    <div class="column"><h2>Preparing</h2><div id="col-preparing"></div></div>
    <div class="column"><h2>Ready</h2><div id="col-ready"></div></div>
    <div class="column"><h2>Completed</h2><div id="col-completed"></div></div>
  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allOrders = [];
    let knownOrderIds = new Set();
    let isInitialFetch = true;

    // Connection monitoring
    function updateConnectionStatus(connected) {
      const el = document.getElementById('live-status-indicator');
      if(!el) return;
      el.style.background = connected ? '#22c55e' : '#ef4444';
      el.innerText = connected ? '🟢 Connected' : '🔴 Disconnected';
    }

    // Order age timers with thresholds
    function getOrderAgeTimerHtml(timestamp) {
      const diffMins = Math.floor((Date.now() - Number(timestamp)) / 60000);
      let bg = '#22c55e';
      if (diffMins >= 20) {
        bg = '#dc2626'; // Red for critical stale orders
      } else if (diffMins >= 15) {
        bg = '#f59e0b'; // Orange for delayed orders
      }
      return `
        <div style="margin-top:6px; display:inline-block; padding:4px 8px; border-radius:20px; color:white; font-size:11px; font-weight:800; background:${bg};">
          ⏱ ${diffMins} min
        </div>
      `;
    }

    // Daily revenue calculation
    function updateDailyRevenue(orders) {
      const revenueElem = document.getElementById('daily-revenue-amount');
      if (!revenueElem) return;

      const todayStr = new Date().toDateString();
      const todayTotal = orders.reduce((sum, order) => {
        const orderDate = new Date(order.created_at || Date.now());
        if (orderDate.toDateString() === todayStr && order.stage === 'completed') {
          return sum + (parseFloat(order.total) || 0);
        }
        return sum;
      }, 0);

      revenueElem.innerText = 'R' + todayTotal.toLocaleString('en-ZA', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // New-order audio chime
    function playNewOrderSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (err) {
        console.error(err);
      }
    }

    function renderKanban() {
      const stages = ['received', 'preparing', 'ready', 'completed'];
      stages.forEach(stage => {
        const container = document.getElementById(`col-${stage}`);
        const stageOrders = allOrders.filter(o => (o.stage || 'received') === stage);
        
        container.innerHTML = stageOrders.map(order => {
          let parsedItems = [];
          try {
            parsedItems = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
          } catch(e) { parsedItems = []; }

          const itemsList = Array.isArray(parsedItems) 
            ? parsedItems.map(i => `• ${i.name}`).join('<br>') 
            : 'Items listed';

          let nextStageBtn = '';
          if (stage === 'received') nextStageBtn = `<button class="btn-action" onclick="updateStage('${order.id}', 'preparing')">Start Preparing ➔</button>`;
          if (stage === 'preparing') nextStageBtn = `<button class="btn-action" onclick="updateStage('${order.id}', 'ready')">Mark Ready ➔</button>`;
          if (stage === 'ready') nextStageBtn = `<button class="btn-action" onclick="updateStage('${order.id}', 'completed')">Complete ➔</button>`;

          const timestampVal = new Date(order.created_at || Date.now()).getTime();

          return `
            <div class="order-card">
              <h4>${order.id}</h4>
              <p><strong>Customer:</strong> ${order.customer_name || 'Guest'}</p>
              <p style="font-size: 13px; margin: 4px 0;">${itemsList}</p>
              <p style="color: #22c55e; font-weight: bold; margin: 4px 0;">R${parseFloat(order.total || 0).toFixed(2)}</p>
              ${getOrderAgeTimerHtml(timestampVal)}
              <div style="margin-top: 8px;">${nextStageBtn}</div>
            </div>
          `;
        }).join('');
      });

      updateDailyRevenue(allOrders);
    }

    async function updateStage(orderId, newStage) {
      const { error } = await supabaseClient
        .from('orders')
        .update({ stage: newStage, status: newStage })
        .eq('id', orderId);

      if (error) {
        alert('Could not update order stage.');
      } else {
        fetchOrders();
      }
    }

    async function fetchOrders() {
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        updateConnectionStatus(false);
      } else {
        updateConnectionStatus(true);
        allOrders = data || [];
        
        if (isInitialFetch) {
          allOrders.forEach(o => knownOrderIds.add(o.id));
          isInitialFetch = false;
        }
        
        renderKanban();
      }
    }

    supabaseClient
      .channel('public:orders')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
        updateConnectionStatus(true);
        if (payload.eventType === 'INSERT') {
          const newOrder = payload.new;
          if (newOrder && newOrder.id && !knownOrderIds.has(newOrder.id)) {
            knownOrderIds.add(newOrder.id);
            if (!isInitialFetch) {
              playNewOrderSound();
            }
          }
        }
        fetchOrders();
      })
      .subscribe((status) => {
        updateConnectionStatus(status === 'SUBSCRIBED');
      });

    fetchOrders();
    setInterval(fetchOrders, 15000);
  </script>
</body>
</html>
