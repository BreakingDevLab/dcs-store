<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard - Store Management & Audit Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .order-card { transition: all 0.2s ease-in-out; }
    .order-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <div id="dashboard" class="min-h-screen flex flex-col">
    
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse" id="status-indicator"></div>
          <h1 class="text-xl font-bold tracking-tight">Store Ops <span class="text-indigo-400">Dashboard</span></h1>
        </div>

        <div class="flex items-center space-x-3">
          <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex space-x-1 text-xs font-medium">
            <button onclick="switchView('kanban')" id="btn-view-kanban" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white transition-colors">Kitchen Kanban</button>
            <button onclick="switchView('audit')" id="btn-view-audit" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-colors">Audit Log</button>
          </div>

          <button id="audio-toggle" onclick="toggleAudio()" 
            class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-lg border border-slate-700 flex items-center space-x-2 transition-colors">
            <span id="audio-icon">🔔</span>
            <span id="audio-label" class="hidden sm:inline">Chime Enabled</span>
          </button>

          <button onclick="fetchOrders()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs">
            ↻ Refresh
          </button>
        </div>
      </div>
    </header>

    <div class="bg-white border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
        <div class="p-3 bg-amber-50 rounded-xl border border-amber-100">
          <p class="text-xs text-amber-700 font-semibold uppercase">Pending</p>
          <p id="count-pending" class="text-2xl font-black text-amber-900">0</p>
        </div>
        <div class="p-3 bg-blue-50 rounded-xl border border-blue-100">
          <p class="text-xs text-blue-700 font-semibold uppercase">Preparing</p>
          <p id="count-preparing" class="text-2xl font-black text-blue-900">0</p>
        </div>
        <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
          <p class="text-xs text-indigo-700 font-semibold uppercase">Ready</p>
          <p id="count-ready" class="text-2xl font-black text-indigo-900">0</p>
        </div>
        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
          <p class="text-xs text-emerald-700 font-semibold uppercase">Completed Today</p>
          <p id="count-completed" class="text-2xl font-black text-emerald-900">0</p>
        </div>
      </div>
    </div>

    <main id="view-kanban" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>New Orders</span>
            <span id="badge-pending" class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="col-pending" class="space-y-4 flex-1"></div>
        </section>

        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>In Preparation</span>
            <span id="badge-preparing" class="bg-blue-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="col-preparing" class="space-y-4 flex-1"></div>
        </section>

        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>Ready for Pickup / Dispatch</span>
            <span id="badge-ready" class="bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="col-ready" class="space-y-4 flex-1"></div>
        </section>

      </div>
    </main>

    <main id="view-audit" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-100">
          <div class="flex flex-wrap items-center gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Status Filter</label>
              <select id="audit-status-filter" onchange="renderAuditLog()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none">
                <option value="ALL">All Orders</option>
                <option value="pending">Pending</option>
                <option value="preparing">Preparing</option>
                <option value="ready">Ready</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase mb-1">From Date</label>
              <input type="date" id="audit-start-date" onchange="renderAuditLog()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase mb-1">To Date</label>
              <input type="date" id="audit-end-date" onchange="renderAuditLog()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none">
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="exportAuditCSV()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold transition-colors flex items-center space-x-2">
              <span>📥 Export CSV</span>
            </button>
            <button onclick="clearAllAuditOrders()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold transition-colors flex items-center space-x-2">
              <span>🗑️ Clear All</span>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-50 text-slate-600 uppercase text-xs tracking-wider border-b border-slate-200">
                <th class="py-3 px-4">Order ID</th>
                <th class="py-3 px-4">Date / Time</th>
                <th class="py-3 px-4">Customer</th>
                <th class="py-3 px-4">Phone</th>
                <th class="py-3 px-4">Items Summary</th>
                <th class="py-3 px-4">Total</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4">Action</th>
              </tr>
            </thead>
            <tbody id="audit-table-body" class="divide-y divide-slate-100">
              <tr><td colspan="8" class="text-center py-8 text-slate-400">Loading audit records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="audit-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div id="audit-modal-content"></div>
      <div class="mt-6 flex justify-end">
        <button onclick="closeAuditModal()" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-semibold">Close</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://qbmszgddepljxqxynyxv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibXN6Z2RkZXBsanhxeHlueXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODUzMzcsImV4cCI6MjEwNjE2MTMzN30.Xn96bQzIKht44_6IYTkXMY6wk3sT2uf2IJtbOhW1WgU";
    const SHARED_KEY = 'davidsonville_app_state_v15';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let audioEnabled = true;
    let audioCtx = null;
    let ordersCache = [];
    let currentView = 'kanban';

    document.addEventListener('DOMContentLoaded', () => {
      fetchOrders();
      subscribeToRealtime();
      // Listen for local storage updates when orders are placed on index.html
      window.addEventListener('storage', (e) => {
        if (e.key === SHARED_KEY) {
          playChime();
          fetchOrders();
        }
      });
      setInterval(fetchOrders, 4000);
    });

    function switchView(view) {
      currentView = view;
      const kanbanEl = document.getElementById('view-kanban');
      const auditEl = document.getElementById('view-audit');
      const btnKanban = document.getElementById('btn-view-kanban');
      const btnAudit = document.getElementById('btn-view-audit');

      if (view === 'kanban') {
        kanbanEl.classList.remove('hidden');
        auditEl.classList.add('hidden');
        btnKanban.className = 'px-3 py-1.5 rounded-md bg-indigo-600 text-white transition-colors';
        btnAudit.className = 'px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-colors';
      } else {
        kanbanEl.classList.add('hidden');
        auditEl.classList.remove('hidden');
        btnAudit.className = 'px-3 py-1.5 rounded-md bg-indigo-600 text-white transition-colors';
        btnKanban.className = 'px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-colors';
        renderAuditLog();
      }
    }

    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.15);
        gain2.gain.setValueAtTime(0.4, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.7);
      } catch (err) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-icon').textContent = audioEnabled ? '🔔' : '🔕';
      document.getElementById('audio-label').textContent = audioEnabled ? 'Chime Enabled' : 'Muted';
      if (audioEnabled) playChime();
    }

    function subscribeToRealtime() {
      supabaseClient
        .channel('dashboard-orders')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'orders' },
          (payload) => {
            if (payload.eventType === 'INSERT') {
              playChime();
            }
            fetchOrders();
          }
        )
        .subscribe((status) => {
          const indicator = document.getElementById('status-indicator');
          if (status === 'SUBSCRIBED') {
            indicator.className = 'h-3 w-3 rounded-full bg-emerald-500 animate-pulse';
          } else {
            indicator.className = 'h-3 w-3 rounded-full bg-amber-500';
          }
        });
    }

    async function fetchOrders() {
      let remoteOrders = [];
      try {
        const { data, error } = await supabaseClient
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });
        if (!error && data) {
          remoteOrders = data;
        }
      } catch (e) {}

      // Fallback / sync with local storage state
      let localState = { orders: [] };
      try {
        const stored = localStorage.getItem(SHARED_KEY);
        if (stored) localState = JSON.parse(stored);
      } catch (e) {}

      const combinedMap = new Map();

      // Add local orders first
      (localState.orders || []).forEach(o => {
        combinedMap.set(String(o.id || o.order_id), {
          order_id: o.id,
          id: o.id,
          customer_name: o.clientName,
          client_name: o.clientName,
          phone: o.phone,
          customer_phone: o.phone,
          address: o.address,
          items: o.items,
          notes: o.instructions,
          instructions: o.instructions,
          total: o.total,
          total_amount: o.total,
          stage: o.stage || 'received',
          status: o.stage || 'received',
          created_at: new Date(o.timestamp || Date.now()).toISOString()
        });
      });

      // Merge remote Supabase orders
      remoteOrders.forEach(o => {
        const oid = String(o.order_id || o.id);
        combinedMap.set(oid, o);
      });

      ordersCache = Array.from(combinedMap.values()).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      renderOrders();
      if (currentView === 'audit') renderAuditLog();
    }

    async function updateOrderStatus(orderId, newStatus) {
      setTimeout(async () => {
        // Update Supabase
        try {
          await supabaseClient
            .from('orders')
            .update({ stage: newStatus, status: newStatus, updated_at: new Date().toISOString() })
            .eq('id', orderId);
        } catch (e) {}

        // Update LocalStorage State as well
        try {
          const stored = localStorage.getItem(SHARED_KEY);
          if (stored) {
            let state = JSON.parse(stored);
            if (state.orders) {
              state.orders = state.orders.map(o => {
                if (String(o.id) === String(orderId)) {
                  o.stage = newStatus;
                }
                return o;
              });
              localStorage.setItem(SHARED_KEY, JSON.stringify(state));
            }
          }
        } catch (e) {}

        fetchOrders();
      }, 10);
    }

    async function clearAllAuditOrders() {
      if (!confirm('Are you sure you want to clear all orders from the audit log?')) return;
      try {
        await supabaseClient.from('orders').delete().neq('id', 0);
      } catch (e) {}
      localStorage.removeItem(SHARED_KEY);
      ordersCache = [];
      renderOrders();
      renderAuditLog();
      alert('All orders cleared.');
    }

    function parseItems(rawItems) {
      if (!rawItems) return [];
      if (Array.isArray(rawItems)) return rawItems;
      try { const p = JSON.parse(rawItems); if (Array.isArray(p)) return p; return [p]; } catch (e) { return [{ name: rawItems, quantity: 1, price: 0 }]; }
    }

    function renderOrders() {
      const columns = {
        pending: document.getElementById('col-pending'),
        preparing: document.getElementById('col-preparing'),
        ready: document.getElementById('col-ready')
      };

      Object.values(columns).forEach(col => col.innerHTML = '');

      const counts = { pending: 0, preparing: 0, ready: 0, completed: 0 };

      ordersCache.forEach(order => {
        const rawStage = (order.stage || order.status || 'pending').toLowerCase().trim().replace(/_/g, '-');
        let stage = rawStage;
        if (rawStage === 'kitchen-prep') stage = 'preparing';
        if (rawStage === 'ready-for-pick-up') stage = 'ready';

        if (stage === 'completed' || stage === 'order-completed' || stage === 'cancelled' || stage === 'received') {
          if (stage === 'received') stage = 'pending'; // Treat received as pending on kanban
          if (stage === 'completed' || stage === 'order-completed' || stage === 'cancelled') {
            counts.completed++;
            return;
          }
        }

        if (counts[stage] !== undefined) counts[stage]++;

        const card = createOrderCard(order, stage);
        if (columns[stage]) {
          columns[stage].appendChild(card);
        }
      });

      document.getElementById('count-pending').textContent = counts.pending;
      document.getElementById('count-preparing').textContent = counts.preparing;
      document.getElementById('count-ready').textContent = counts.ready;
      document.getElementById('count-completed').textContent = counts.completed;

      document.getElementById('badge-pending').textContent = counts.pending;
      document.getElementById('badge-preparing').textContent = counts.preparing;
      document.getElementById('badge-ready').textContent = counts.ready;
    }

    function createOrderCard(order, stage) {
      const card = document.createElement('div');
      card.className = "order-card bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3";

      const timeFormatted = order.created_at ? new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const items = parseItems(order.items);
      const orderIdKey = order.order_id || order.id || 'DCS-01';
      const customerName = order.customer_name || order.client_name || 'Walk-in Customer';
      const customerPhone = order.customer_phone || order.phone || '';
      const totalAmount = Number(order.total || order.total_amount || 0);
      const notes = order.notes || order.instructions || '';

      let itemsListHtml = items.map(item => {
        const qty = item.quantity || item.qty || 1;
        const name = item.name || item.title || 'Item';
        const price = Number(item.price || 0);
        return `<div class="flex justify-between text-xs text-slate-600"><span><strong class="text-slate-800">${qty}x</strong> ${name}</span><span>R${(price * qty).toFixed(2)}</span></div>`;
      }).join('');

      let actionButtonsHtml = '';
      if (stage === 'pending') {
        actionButtonsHtml = `<button onclick="updateOrderStatus('${orderIdKey}', 'kitchen-prep')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-3 rounded-lg text-xs transition-colors">Start Preparing →</button>`;
      } else if (stage === 'preparing') {
        actionButtonsHtml = `<button onclick="updateOrderStatus('${orderIdKey}', 'ready')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-1.5 px-3 rounded-lg text-xs transition-colors">Mark Ready →</button>`;
      } else if (stage === 'ready') {
        actionButtonsHtml = `<div class="flex space-x-2">
          <button onclick="updateOrderStatus('${orderIdKey}', 'order-completed')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 px-2 rounded-lg text-xs transition-colors">Complete ✓</button>
          <button onclick="updateOrderStatus('${orderIdKey}', 'cancelled')" class="bg-red-500 hover:bg-red-600 text-white font-medium py-1.5 px-2 rounded-lg text-xs transition-colors">Cancel ✕</button>
        </div>`;
      }

      card.innerHTML = `
        <div>
          <div class="flex justify-between items-start border-b border-slate-100 pb-2 mb-2">
            <div>
              <span class="text-xs font-bold text-slate-400">#${orderIdKey}</span>
              <h3 class="font-bold text-slate-900 text-sm">${customerName}</h3>
              <p class="text-[11px] text-slate-500">${customerPhone}</p>
            </div>
            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">${timeFormatted}</span>
          </div>
          <div class="space-y-1 my-2 max-h-36 overflow-y-auto">${itemsListHtml}</div>
          ${notes ? `<div class="mt-2 text-[11px] bg-amber-50 text-amber-800 p-2 rounded border border-amber-200 font-medium">⚠️ ${notes}</div>` : ''}
        </div>
        <div class="pt-2 border-t border-slate-100">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-500">Total:</span>
            <span class="text-sm font-black text-slate-900">R${totalAmount.toFixed(2)}</span>
          </div>
          ${actionButtonsHtml}
        </div>
      `;

      return card;
    }

    function renderAuditLog() {
      const tbody = document.getElementById('audit-table-body');
      const statusFilter = document.getElementById('audit-status-filter').value;
      const startDate = document.getElementById('audit-start-date').value;
      const endDate = document.getElementById('audit-end-date').value;

      let filtered = [...ordersCache];

      if (statusFilter !== 'ALL') {
        filtered = filtered.filter(o => {
          const st = (o.stage || o.status || 'pending').toLowerCase().trim();
          if (statusFilter === 'completed') return st === 'completed' || st === 'order-completed';
          if (statusFilter === 'preparing') return st === 'preparing' || st === 'kitchen-prep';
          if (statusFilter === 'ready') return st === 'ready' || st === 'ready-for-pick-up';
          return st === statusFilter;
        });
      }

      if (startDate) {
        const start = new Date(startDate).setHours(0,0,0,0);
        filtered = filtered.filter(o => o.created_at && new Date(o.created_at).setHours(0,0,0,0) >= start);
      }

      if (endDate) {
        const end = new Date(endDate).setHours(23,59,59,999);
        filtered = filtered.filter(o => o.created_at && new Date(o.created_at).setHours(0,0,0,0) <= end);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-400">No orders match the selected filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(o => {
        const orderIdKey = o.order_id || o.id || 'DCS-01';
        const dateStr = o.created_at ? new Date(o.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '';
        const customerName = o.customer_name || o.client_name || 'Walk-in';
        const phone = o.customer_phone || o.phone || 'N/A';
        const items = parseItems(o.items);
        const itemSummary = items.map(i => `${i.quantity || i.qty || 1}x ${i.name || i.title}`).join(', ');
        const total = Number(o.total || o.total_amount || 0);
        const st = (o.stage || o.status || 'pending').toLowerCase();

        let badgeColor = 'bg-slate-100 text-slate-700';
        if (st === 'pending' || st === 'received') badgeColor = 'bg-amber-100 text-amber-800';
        else if (st === 'preparing' || st === 'kitchen-prep') badgeColor = 'bg-blue-100 text-blue-800';
        else if (st === 'ready' || st === 'ready-for-pick-up') badgeColor = 'bg-indigo-100 text-indigo-800';
        else if (st === 'completed' || st === 'order-completed') badgeColor = 'bg-emerald-100 text-emerald-800';
        else if (st === 'cancelled') badgeColor = 'bg-red-100 text-red-800';

        return `
          <tr class="hover:bg-slate-50">
            <td class="py-3 px-4 font-bold text-slate-900">#${orderIdKey}</td>
            <td class="py-3 px-4 text-slate-600">${dateStr}</td>
            <td class="py-3 px-4 font-semibold text-slate-800">${customerName}</td>
            <td class="py-3 px-4 text-slate-600">${phone}</td>
            <td class="py-3 px-4 text-slate-600 max-w-xs truncate" title="${itemSummary}">${itemSummary}</td>
            <td class="py-3 px-4 font-bold text-slate-900">R${total.toFixed(2)}</td>
            <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold uppercase ${badgeColor}">${st.replace('_', ' ')}</span></td>
            <td class="py-3 px-4">
              <button onclick="viewAuditOrderModal('${orderIdKey}')" class="text-xs text-indigo-600 hover:underline font-semibold">View</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function viewAuditOrderModal(orderId) {
      const o = ordersCache.find(x => String(x.order_id || x.id) === String(orderId));
      if (!o) return;
      const items = parseItems(o.items);
      const modal = document.getElementById('audit-modal');
      const content = document.getElementById('audit-modal-content');

      const notes = o.notes || o.instructions || '';
      let itemsHtml = items.map(i => {
        const q = i.quantity || i.qty || 1;
        const n = i.name || i.title || 'Item';
        const p = Number(i.price || 0);
        return `<li class="flex justify-between py-1 border-b border-slate-100"><span>${q}x ${n}</span><span class="font-bold">R${(q * p).toFixed(2)}</span></li>`;
      }).join('');

      content.innerHTML = `
        <h3 class="text-lg font-bold text-slate-900 mb-3">Order Details #${o.order_id || o.id}</h3>
        <p class="text-sm text-slate-600 mb-1"><strong>Customer:</strong> ${o.customer_name || o.client_name || 'Walk-in'} (${o.customer_phone || o.phone || 'N/A'})</p>
        <p class="text-sm text-slate-600 mb-3"><strong>Address:</strong> ${o.address || 'N/A'}</p>
        ${notes ? `<div class="mb-3 p-2 bg-amber-50 text-amber-800 text-xs rounded border border-amber-200"><strong>Notes:</strong> ${notes}</div>` : ''}
        <h4 class="font-bold text-sm text-slate-700 mb-2">Items:</h4>
        <ul class="space-y-1 mb-4 text-sm">${itemsHtml}</ul>
        <div class="flex justify-between text-base font-bold text-slate-900 pt-2 border-t border-slate-200">
          <span>Total:</span> <span class="text-amber-600">R${Number(o.total || o.total_amount || 0).toFixed(2)}</span>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeAuditModal() {
      const modal = document.getElementById('audit-modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function exportAuditCSV() {
      if (ordersCache.length === 0) { alert('No orders to export'); return; }
      let csv = 'OrderID,Date,Customer,Phone,Total,Status\n';
      ordersCache.forEach(o => {
        const oid = o.order_id || o.id || 'DCS-01';
        const date = o.created_at ? new Date(o.created_at).toISOString() : '';
        const name = (o.customer_name || o.client_name || '').replace(/,/g, '');
        const phone = o.customer_phone || o.phone || '';
        const total = Number(o.total || o.total_amount || 0).toFixed(2);
        const stage = o.stage || o.status || 'pending';
        csv += `${oid},${date},${name},${phone},${total},${stage}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `store_audit_log_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
  </script>
</body>
</html>
