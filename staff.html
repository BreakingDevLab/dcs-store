<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard - Store Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .order-card { transition: all 0.2s ease-in-out; }
    .order-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <div id="dashboard" class="min-h-screen flex flex-col">
    
    <!-- TOP NAVIGATION BAR -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse" id="status-indicator"></div>
          <h1 class="text-xl font-bold tracking-tight">Store Ops <span class="text-indigo-400">Dashboard</span></h1>
        </div>

        <div class="flex items-center space-x-4">
          <button id="audio-toggle" onclick="toggleAudio()" 
            class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-lg border border-slate-700 flex items-center space-x-2 transition-colors">
            <span id="audio-icon">🔔</span>
            <span id="audio-label">Chime Enabled</span>
          </button>

          <button onclick="fetchOrders()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold">
            ↻ Refresh
          </button>
        </div>
      </div>
    </header>

    <!-- METRICS OVERVIEW BAR -->
    <div class="bg-white border-b border-slate-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
        <div class="p-3 bg-amber-50 rounded-xl border border-amber-100">
          <p class="text-xs text-amber-700 font-semibold uppercase">Pending</p>
          <p id="count-pending" class="text-2xl font-black text-amber-900">0</p>
        </div>
        <div class="p-3 bg-blue-50 rounded-xl border border-blue-100">
          <p class="text-xs text-blue-700 font-semibold uppercase">Preparing</p>
          <p id="count-preparing" class="text-2xl font-black text-blue-900">0</p>
        </div>
        <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
          <p class="text-xs text-indigo-700 font-semibold uppercase">Ready</p>
          <p id="count-ready" class="text-2xl font-black text-indigo-900">0</p>
        </div>
        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
          <p class="text-xs text-emerald-700 font-semibold uppercase">Completed Today</p>
          <p id="count-completed" class="text-2xl font-black text-emerald-900">0</p>
        </div>
      </div>
    </div>

    <!-- KANBAN BOARD / ORDER STAGES -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

        <!-- STAGE: PENDING -->
        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>New Orders</span>
            <span id="badge-pending" class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </h2>
          <div id="col-pending" class="space-y-4 flex-1"></div>
        </section>

        <!-- STAGE: PREPARING -->
        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>In Preparation</span>
            <span id="badge-preparing" class="bg-blue-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </h2>
          <div id="col-preparing" class="space-y-4 flex-1"></div>
        </section>

        <!-- STAGE: READY -->
        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>Ready for Pickup</span>
            <span id="badge-ready" class="bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </h2>
          <div id="col-ready" class="space-y-4 flex-1"></div>
        </section>

        <!-- STAGE: COMPLETED -->
        <section class="flex flex-col bg-slate-200/60 p-4 rounded-2xl min-h-[500px]">
          <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide mb-4 flex items-center justify-between">
            <span>Completed</span>
            <span id="badge-completed" class="bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </h2>
          <div id="col-completed" class="space-y-4 flex-1"></div>
        </section>

      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://qbmszgddepljxqxynyxv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFibXN6Z2RkZXBsanhxeHlueXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODUzMzcsImV4cCI6MjEwNjE2MTMzN30.Xn96bQzIKht44_6IYTkXMY6wk3sT2uf2IJtbOhW1WgU";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let audioEnabled = true;
    let audioCtx = null;
    let ordersCache = [];

    document.addEventListener('DOMContentLoaded', () => {
      fetchOrders();
      subscribeToRealtime();
    });

    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        
        const now = audioCtx.currentTime;
        
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.15);
        gain2.gain.setValueAtTime(0.4, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.7);
      } catch (err) {
        console.warn("Audio playback issue:", err);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-icon').textContent = audioEnabled ? '🔔' : '🔕';
      document.getElementById('audio-label').textContent = audioEnabled ? 'Chime Enabled' : 'Muted';
      if (audioEnabled) playChime();
    }

    function subscribeToRealtime() {
      supabaseClient
        .channel('dashboard-orders')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'orders' },
          (payload) => {
            if (payload.eventType === 'INSERT') {
              playChime();
            }
            fetchOrders();
          }
        )
        .subscribe((status) => {
          const indicator = document.getElementById('status-indicator');
          if (status === 'SUBSCRIBED') {
            indicator.className = 'h-3 w-3 rounded-full bg-emerald-500 animate-pulse';
          } else {
            indicator.className = 'h-3 w-3 rounded-full bg-amber-500';
          }
        });
    }

    async function fetchOrders() {
      const { data: orders, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error fetching orders:", error.message);
        return;
      }

      ordersCache = orders || [];
      renderOrders();
    }

    async function updateOrderStatus(dbId, newStage) {
      const { error } = await supabaseClient
        .from('orders')
        .update({ stage: newStage, updated_at: new Date().toISOString() })
        .eq('id', dbId);

      if (error) {
        const { error: errorAlt } = await supabaseClient
          .from('orders')
          .update({ stage: newStage })
          .eq('order_id', dbId);
        
        if (errorAlt) {
          alert(`Failed to update status: ${error.message}`);
          return;
        }
      }
      fetchOrders();
    }

    function parseItems(itemsData) {
      if (!itemsData) return [];
      if (Array.isArray(itemsData)) return itemsData;
      if (typeof itemsData === 'string') {
        try {
          const parsed = JSON.parse(itemsData);
          if (Array.isArray(parsed)) return parsed;
          return [parsed];
        } catch (e) {
          return [{ name: itemsData, qty: 1, price: 0 }];
        }
      }
      return [itemsData];
    }

    function renderOrders() {
      const columns = {
        pending: document.getElementById('col-pending'),
        preparing: document.getElementById('col-preparing'),
        ready: document.getElementById('col-ready'),
        completed: document.getElementById('col-completed')
      };

      Object.values(columns).forEach(col => col.innerHTML = '');

      const counts = { pending: 0, preparing: 0, ready: 0, completed: 0 };

      ordersCache.forEach(order => {
        const rawStage = (order.stage || order.status || 'pending').toLowerCase();
        let normalizedStage = 'pending';
        if (rawStage.includes('prep') || rawStage === 'preparing') normalizedStage = 'preparing';
        else if (rawStage.includes('ready')) normalizedStage = 'ready';
        else if (rawStage.includes('complete') || rawStage === 'completed') normalizedStage = 'completed';
        else normalizedStage = 'pending';

        counts[normalizedStage] = (counts[normalizedStage] || 0) + 1;

        const itemsList = parseItems(order.items);
        const orderIdDisplay = order.order_id || order.id;
        const dbId = order.id;

        const itemsHtml = itemsList.map(item => `
          <div class="flex justify-between items-center text-xs py-1 border-b border-slate-100">
            <span class="font-medium text-slate-700"><span class="font-bold text-amber-600">${item.qty || 1}x</span> ${item.name || item.title || 'Item'}</span>
            <span class="font-bold text-slate-900">${item.price ? 'R' + Number(item.price * (item.qty || 1)).toFixed(2) : ''}</span>
          </div>
        `).join('');

        let actionButtonsHtml = '';
        if (normalizedStage === 'pending') {
          actionButtonsHtml = `
            <button onclick="updateOrderStatus('${dbId}', 'preparing')" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow transition">
              👨‍🍳 Start Preparing
            </button>`;
        } else if (normalizedStage === 'preparing') {
          actionButtonsHtml = `
            <button onclick="updateOrderStatus('${dbId}', 'ready')" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg shadow transition">
              ✅ Mark Ready for Pickup
            </button>`;
        } else if (normalizedStage === 'ready') {
          actionButtonsHtml = `
            <button onclick="updateOrderStatus('${dbId}', 'completed')" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow transition">
              🏁 Complete Order
            </button>`;
        } else {
          actionButtonsHtml = `
            <div class="text-center text-xs font-semibold text-emerald-600 py-1 bg-emerald-50 rounded-lg">
              ✓ Order Finished
            </div>`;
        }

        const cardHtml = `
          <div class="order-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-3">
            <div>
              <div class="flex justify-between items-start pb-2 border-b border-slate-100">
                <div>
                  <h3 class="font-extrabold text-slate-900 text-sm">#${orderIdDisplay}</h3>
                  <p class="text-xs font-semibold text-slate-600">${order.client_name || 'Customer'}</p>
                  <p class="text-[11px] text-slate-400">📞 ${order.phone || 'N/A'}</p>
                </div>
                <span class="text-xs font-black text-amber-600 bg-amber-50 px-2 py-1 rounded-md">
                  R${Number(order.total || 0).toFixed(2)}
                </span>
              </div>

              <div class="py-2">
                ${itemsHtml}
              </div>

              ${order.instructions ? `
                <div class="mt-1 p-2 bg-amber-50/80 border-l-2 border-amber-500 text-[11px] text-amber-900 rounded-r">
                  <span class="font-bold">Note:</span> ${order.instructions}
                </div>
              ` : ''}

              <div class="mt-2 text-[11px] text-slate-400 flex justify-between">
                <span>💳 ${order.payment_method || 'Cash'}</span>
                <span>⏱️ ${order.created_at ? new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</span>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-100">
              ${actionButtonsHtml}
            </div>
          </div>
        `;

        if (columns[normalizedStage]) {
          columns[normalizedStage].innerHTML += cardHtml;
        }
      });

      document.getElementById('count-pending').textContent = counts.pending || 0;
      document.getElementById('count-preparing').textContent = counts.preparing || 0;
      document.getElementById('count-ready').textContent = counts.ready || 0;
      document.getElementById('count-completed').textContent = counts.completed || 0;

      document.getElementById('badge-pending').textContent = counts.pending || 0;
      document.getElementById('badge-preparing').textContent = counts.preparing || 0;
      document.getElementById('badge-ready').textContent = counts.ready || 0;
      document.getElementById('badge-completed').textContent = counts.completed || 0;
    }
  </script>
</body>
</html>
